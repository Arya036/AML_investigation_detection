name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (mlops/ and tests/ only)
        run: ruff check mlops/ tests/ --select E,F,W --ignore E501

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

